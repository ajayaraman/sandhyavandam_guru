# Short English coaching lines spoken by the guru voice (Piper) at the start of each step.
# Keep each to 1–2 calm, instructive sentences. The voice is a teacher, not a narrator.

lines:
  01_aachamanam: |
    Begin by sitting and facing east. Cup your right palm, sip a little water with each of the three names, then touch your face and body as we chant the keshava names.
  02_praanaayaama: |
    Now we breathe. Close the right nostril with your thumb and inhale through the left. Hold gently, then exhale through the right. We chant inwardly as we breathe.
  03_sankalpam: |
    Make your sankalpam. With your right palm covering your left, declare your intention to perform the morning sandhya for the pleasure of the supreme.
  04_mantra_prokshanam: |
    Write the syllable om on the water with your finger, then sprinkle a few drops on your head with each of the apo hishta mantras.
  05_praashanam: |
    Sip a small amount of water as we chant the surya-shcha-maa-manyu-shcha mantra. This is the prashanam for the morning sandhya.
  06_aachamanam_2: |
    A second achamana. Three small sips of water, one for each of the names achyuta, ananta, and govinda.
  07_punah_prokshanam: |
    Sprinkle water again, this time with the dadhikraavanno mantra, then the apo hishta verses, and the cosmic rta-cha-satyam verse.
  08_arghya_pradaanam: |
    Stand and face east. Pour water from your joined palms three times as we chant the full Gayatri. This is the arghya, the morning offering.
  09_praayashchita_arghyam: |
    A brief pranayama, then one more arghya as a remedy. Turn once where you stand while sprinkling the water.
  10_aikyaanusandhaanam: |
    Sit, close your eyes, and chant slowly: that sun yonder is brahman; I myself am that brahman.
  11_deva_tarpanam: |
    Squat, facing east. Pour water through your fingertips for the nine planets and the twelve keshava names — twenty one oblations in all.
  12_japa_sankalpa: |
    Sit on your mat. Recite the shuklambaradharam shloka, do one pranayama, and make the sankalpa to begin the Gayatri japa.
  13_pranava_japam: |
    Touching your head, lips, and chest, declare the rishi, chandas, and devata for om, the seven vyahritis, and the Gayatri. Then three pranayamas.
  14_gaayatree_aavaahanam: |
    Invoke Gayatri into your heart using the avahani mudra, with the aayaatu varadaa devi verses.
  15_gaayatree_nyaasam: |
    Place the Gayatri upon your head, lips, and chest as we recite saavitryaa rishihi, vishvaamitra.
  16_gaayatree_japam: |
    Stand facing east. Cover your hands with your angavastra and chant the Gayatri silently, one hundred and eight times.
  17_gaayatree_upasthaanam: |
    One pranayama, then the standing prayer asking Gayatri to return to her abode until you call her again.
  18_soorya_upasthaanam: |
    One pranayama, then the surya upasthana — the morning verse mitrasya charshani druto. Offer your gratitude to the rising sun.
  19_samashti_abhivaadanam: |
    Make four namaskaras turning in place to Sandhya, Savitri, Gayatri, and Sarasvati. Then declare your personal abhivadanam — your pravara, gotra, sutra, veda, and name.
  20_digdevataa_vandanam: |
    Salute the eleven directional deities in turn, finishing with namaha to mrityu.
  21_yama_vandanam: |
    Face south and offer the six-line obeisance to Yama Dharmaraja, lord of righteousness.
  22_harihara_vandanam: |
    Face west and chant rta gam satyam para brahma — the prayer to Hari and Hara as the one supreme being.
  23_soorya_naaraayaNa_vandanam: |
    Salute Surya as Narayana. The names lead naturally to keshava, completing the morning surya prayer.
  24_samarpanam: |
    Sit. Pour water through your fingers as you offer the fruits of all you have done — by body, speech, mind, intellect, or nature — at the feet of Narayana.
  25_aachamanam_3: |
    The closing achamana. Three sips of water, one each for achyuta, ananta, and govinda.
  26_rakshaa: |
    Finally, the rakshaa. Sprinkle water on your japa spot, touch your forehead, and chant adya no deva savitaa for the protection that completes the morning sandhya.
