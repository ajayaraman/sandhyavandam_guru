[project]
name = "sandhyavandanam-guru"
version = "0.1.0"
description = "Terminal coach that walks an initiate through the Rigveda Pratah Sandhyavandanam ritual."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "textual>=0.79",
    "rich>=13.7",
]

[project.optional-dependencies]
eval = ["sounddevice>=0.4", "numpy>=1.26"]
shootout = ["faster-whisper>=1.0", "openai>=1.40", "indic-transliteration>=2.3"]
shootout-mlx = ["mlx-whisper>=0.4", "openai>=1.40", "indic-transliteration>=2.3"]
audio = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "silero-vad>=5.1",
    "openai>=1.40",
    "indic-transliteration>=2.3",
]
clone = [
    "myshell-openvoice",
    "melotts",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
clone-f5 = [
    "f5-tts>=0.6",
    "torchcodec>=0.13",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # numpy is imported at module level by several test files (test_player,
    # test_tts_*, test_audio_integration) — must be installed for the unit
    # suite to even collect, even though the production code defers it.
    "numpy>=1.26",
]

[tool.uv]
# OpenVoice upstream pins numpy==1.22 and librosa==0.9.1; these conflict with
# every other audio dep we use. Override to modern versions — confirmed to work
# in practice.
override-dependencies = [
    "numpy>=1.26",
    "librosa>=0.10",
    "scipy>=1.11",
    "faster-whisper>=1.0",
    "transformers==4.49.0",
    "tokenizers>=0.21,<0.22",
]

[tool.uv.sources]
myshell-openvoice = { git = "https://github.com/myshell-ai/OpenVoice.git" }
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git" }

[project.scripts]
sgr = "sandhyavandanam_guru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandhyavandanam_guru"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
